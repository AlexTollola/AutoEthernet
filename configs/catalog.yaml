# Catalog schema version
version: 1

# Signal definitions shared by messages
# name: Signal name (referenced by messages)
# type: Signal data type (u8/u16/u32/i8/i16/i32/f32/f64)
# scale: Scale factor applied to the raw value
# offset: Offset applied after scaling
# unit: Engineering unit label
# default: Default value used when not explicitly set

signals:
  
  - name: vehicle_speed_kph
    type: u16
    scale: 0.1
    offset: 0.0
    unit: kph
    default: 0.0

  - name: engine_rpm
    type: u16
    scale: 1.0
    offset: 0.0
    unit: rpm
    default: 800.0

  - name: steering_angle_deg
    type: i16
    scale: 0.1
    offset: 0.0
    unit: deg
    default: 0.0


# Service definitions (SOME/IP + instance metadata)
# SOME/IP service ID (hex allowed)
# SOME/IP instance ID (hex allowed)
# SOME/IP interface version
# SOME/IP service major version
# SOME/IP service minor version

services:
  - name: demo_service
    service_id: 0x1234
    instance_id: 0x0001
    interface_version: 1
    major_version: 1
    minor_version: 0

# Message definitions (events/methods)
# name: Message name
# msg_id: Message ID used by AutoEth framing
# kind: event or method
# transport: udp or tcp
# period_ms: Event publishing period (ms)
# udp.mode: UDP mode (unicast or multicast)
# udp.mcast_group: Multicast group IP (when mode=multicast)
# udp.port: UDP destination port
# udp.ttl: Multicast TTL / hop limit
# udp.iface: Interface name for multicast (platform-specific)
# tcp.port: TCP listen/connect port
# tcp.timeout_ms: TCP request timeout in ms
# someip.service: Service name reference from services[]
# someip.event_id: SOME/IP event ID (hex allowed)
# signals: Signal list encoded in payload
# e2e.enabled: Enable end-to-end protection
# e2e.crc16: CRC algorithm name

messages:
  - name: fast_dynamics_event
    msg_id: 1
    kind: event
    transport: udp
    period_ms: 50
    udp:
      mode: multicast
      mcast_group: 239.255.0.1
      port: 30509
      ttl: 1
      iface: eth0
    someip:
      service: demo_service
      event_id: 0x0100
    signals: [vehicle_speed_kph, engine_rpm, steering_angle_deg]
    e2e: { enabled: true, crc16: ccitt-false }

  - name: control_method
    msg_id: 2
    kind: method
    transport: tcp
    tcp: { port: 30510, timeout_ms: 200 }
    someip:
      service: demo_service
      method_id: 0x0200
    signals: [steering_angle_deg]
    e2e: { enabled: true, crc16: ccitt-false }

  - name: testing_method
    msg_id: 3
    kind: method
    transport: tcp
    tcp: { port: 30510, timeout_ms: 200 }
    someip:
      service: demo_service
      method_id: 0x0300
    signals: [vehicle_speed_kph]
    e2e: { enabled: true, crc16: ccitt-false }
