signals:
  - name: vehicle_speed_kph
    type: u16
    scale: 0.1
    offset: 0.0
    unit: kph
    default: 0.0

  - name: engine_rpm
    type: u16
    scale: 1.0
    offset: 0.0
    unit: rpm
    default: 800.0

  - name: steering_angle_deg
    type: i16
    scale: 0.1
    offset: 0.0
    unit: deg
    default: 0.0
