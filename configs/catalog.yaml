version: 1

signals:
  - name: vehicle_speed_kph
    type: u16
    scale: 0.1
    offset: 0.0
    unit: kph
    default: 0.0

  - name: engine_rpm
    type: u16
    scale: 1.0
    offset: 0.0
    unit: rpm
    default: 800.0

  - name: steering_angle_deg
    type: i16
    scale: 0.1
    offset: 0.0
    unit: deg
    default: 0.0

services:
  - name: demo_service
    service_id: 0x1234
    instance_id: 0x0001
    interface_version: 1
    major_version: 1
    minor_version: 0

messages:
  - name: fast_dynamics_event
    msg_id: 1
    kind: event
    transport: udp
    period_ms: 50
    udp:
      mode: multicast
      mcast_group: 239.255.0.1
      port: 30509
      ttl: 1
      iface: eth0
    someip:
      service: demo_service
      event_id: 0x0100
    signals:
      - vehicle_speed_kph
      - engine_rpm
      - steering_angle_deg
    e2e:
      enabled: true
      crc16: ccitt-false

  - name: control_method
    msg_id: 2
    kind: method
    transport: tcp
    tcp:
      port: 30510
      timeout_ms: 200
    someip:
      service: demo_service
      method_id: 0x0200
    signals:
      - steering_angle_deg
    e2e:
      enabled: true
      crc16: ccitt-false

